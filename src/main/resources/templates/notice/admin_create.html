<!DOCTYPE html>
<html lang="ko">

<th:block th:replace="~{includes/admin/head}" />

<body id="page-top">

<!-- Page Wrapper -->
<div id="wrapper">

    <th:block th:replace="~{includes/admin/sidebar}" />
    <script>
        $(".nav_notice_a").removeClass("collapsed");
        $(".nav_notice_div").addClass("show");
    </script>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">

        <!-- Main Content -->
        <div id="content">

            <th:block th:replace="~{includes/admin/topbar}" />

            <!-- Begin Page Content -->
            <div class="container-fluid">

                <!-- Page Heading -->
                <h1 class="h3 mb-2 text-gray-800">공지사항 생성</h1>
                <p class="mb-4">신규 공지사항을 작성합니다.</p>

                <div class="mb-4">
                    <div class="form-group row">

                        <label class="col-sm-2 col-form-label">*제목</label>
                        <div class="col-sm-6">
                            <input type="text" class="input_param input_required form-control mb-2"
                                   id="create_notice_title" name="title" placeholder="제목을 입력해주세요!" />
                        </div>
                        <label class="col-sm-4"></label>

                        <label class="col-sm-2 col-form-label">*내용</label>
                        <div class="col-sm-10">
                            <textarea class="input_param input_required form-control mb-2"
                                      id="create_notice_content" name="content"
                                      rows="10" placeholder="내용을 입력해주세요!"></textarea>
                        </div>

                        <label class="col-sm-2 col-form-label">상단 고정</label>
                        <div class="col-sm-4">
                            <select class="input_param form-control mb-2" id="create_notice_pinned" name="pinned">
                                <option value="false" selected>고정 안함</option>
                                <option value="true">상단 고정</option>
                            </select>
                        </div>
                        <label class="col-sm-6"></label>

                    </div>
                </div>
                <button class="btn btn-primary" onclick="create_notice(); return false;">생성하기</button>
                <a class="btn btn-secondary ml-2" href="/notice/admin_list">목록으로</a>
            </div>
            <!-- /.container-fluid -->

        </div>
        <!-- End of Main Content -->

        <th:block th:replace="~{includes/admin/footer}" />

    </div>
    <!-- End of Content Wrapper -->

</div>
<!-- End of Page Wrapper -->

<th:block th:replace="~{includes/admin/bottom}" />

<script>
    $(document).ready(function() {
        console.log("ready!");
    });

    function create_notice() {
        // 필수 입력 체크
        let title = $("#create_notice_title").val();
        let content = $("#create_notice_content").val();

        if (!title || title.trim() === '') {
            alert("제목을 입력해주세요.");
            $("#create_notice_title").focus();
            return;
        }
        if (!content || content.trim() === '') {
            alert("내용을 입력해주세요.");
            $("#create_notice_content").focus();
            return;
        }

        let _param = {
            title: title,
            content: content,
            pinned: $("#create_notice_pinned").val() === "true"
        };

        let _data = {
            url: "/api/notice",
            beforeSend : function(xhr){
                let accessToken = localStorage.getItem("accessToken");
                xhr.setRequestHeader("Authorization", accessToken);
            },
            type: "POST",
            param: _param,
            success: function(data) {
                alert("공지사항이 등록되었습니다.");
                location.href = "/notice/admin_list";
            },
            error: function() {
                alert("정상적으로 이루어지지 않았습니다. 다시 시도해주세요.");
            }
        };
        func_ajax(_data);
    }
</script>

</body>
</html>
